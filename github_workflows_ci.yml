name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check --select E,F,W,I snipy
      - run: python -m compileall -q snipy
      - run: |
          SNIPY_GUILD_ID=1 SNIPY_TOKENS=x SNIPY_CODES=test \
          SNIPY_CACHE_PATH=/tmp/c.db python -m snipy --report --json
